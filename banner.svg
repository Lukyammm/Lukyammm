<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lukyam Madeira — Data &amp; BI Analyst | Python Automation">
  <defs>
    <clipPath id="rnd"><rect width="900" height="240" rx="6"/></clipPath>
  </defs>

  <g clip-path="url(#rnd)">
    <!-- Fundo escuro industrial integrado ao GitHub (#090a0f) -->
    <rect width="900" height="240" fill="#090a0f"/>
    <rect width="900" height="240" fill="none" stroke="#21262d" stroke-width="1" rx="6"/>

    <!-- Barra Técnica Superior -->
    <line x1="0" y1="36" x2="900" y2="36" stroke="#21262d" stroke-width="1"/>
    
    <rect x="0" y="0" width="130" height="36" fill="#161b22"/>
    <text x="16" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', monospace" font-size="11" font-weight="600" letter-spacing="1.2" fill="#e6edf3">SYSTEM // 01</text>
    <line x1="130" y1="0" x2="130" y2="36" stroke="#21262d" stroke-width="1"/>
    
    <text x="146" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', monospace" font-size="11" letter-spacing="0.8" fill="#8b949e">STACK: PYTHON · DUCKDB · SQL · POWER BI</text>
    
    <line x1="650" y1="0" x2="650" y2="36" stroke="#21262d" stroke-width="1"/>
    <text x="666" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', monospace" font-size="11" font-weight="600" letter-spacing="0.8" fill="#f97316">● TELEMETRIA EM PRODUÇÃO</text>

    <!-- Divisor Vertical Central -->
    <line x1="530" y1="36" x2="530" y2="240" stroke="#21262d" stroke-width="1"/>

    <!-- LADO ESQUERDO: Nome Imponente mas Sóbrio, Cargo e Trajetória -->
    <g transform="translate(36, 52)">
      <!-- Nome: Sans SemiBold sóbria (peso 600, 44px, branco nobre) -->
      <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="600" fill="#f0f6fc" letter-spacing="-0.4">Lukyam Madeira</text>
      
      <!-- Cargo sóbrio em tom azul-acinzentado refinado -->
      <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="14.5" font-weight="500" letter-spacing="0.6" fill="#7dd3fc">Data &amp; BI Analyst · Python Automation</text>
      
      <!-- Frase operacional direta -->
      <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#8b949e">Pipelines automatizados, extração em escala e inteligência operacional.</text>

      <!-- Metadados de Trajetória sóbrios -->
      <g transform="translate(0, 134)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', monospace" font-size="11" fill="#6e7681">
        <text x="0" y="0">EBM Quintto (Atual) · ISGH (2022–2026) · Caucaia / Fortaleza, CE</text>
      </g>
    </g>

    <!-- LADO DIREITO: Telemetria Real de Produção Sóbria -->
    <g transform="translate(555, 52)">
      <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#8b949e">ESCOPO REAL CONSTRUÍDO</text>

      <!-- Linha 1: 73,952 Linhas Python -->
      <g transform="translate(0, 34)">
        <text x="0" y="26" font-family="'JetBrains Mono', 'IBM Plex Mono', 'Consolas', monospace" font-size="30" font-weight="700" fill="#f97316" letter-spacing="-0.5">73,952</text>
        <text x="125" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="500" fill="#f0f6fc">linhas de Python</text>
        <text x="125" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Inter', monospace" font-size="10.5" fill="#8b949e">429 módulos (Scraping, QA, Hub)</text>
      </g>

      <line x1="0" y1="84" x2="310" y2="84" stroke="#21262d" stroke-width="1"/>

      <!-- Linha 2: ~150k Apps Script / 25 Sistemas Hospitalares -->
      <g transform="translate(0, 98)">
        <text x="0" y="26" font-family="'JetBrains Mono', 'IBM Plex Mono', 'Consolas', monospace" font-size="30" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">~150k</text>
        <text x="105" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="500" fill="#f0f6fc">linhas em Apps Script</text>
        <text x="105" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Inter', monospace" font-size="10.5" fill="#8b949e">25 sistemas hospitalares ativos</text>
      </g>
    </g>

