<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lukyam Madeira — Data &amp; BI Analyst">
  <defs>
    <clipPath id="rnd"><rect width="900" height="220" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#rnd)">
    <!-- Fundo GitHub Dark (#0d1117) com borda padrão (#30363d) -->
    <rect width="900" height="220" fill="#0d1117"/>
    <rect width="900" height="220" fill="none" stroke="#30363d" stroke-width="1" rx="10"/>

    <!-- LADO ESQUERDO: Identidade e Atuação -->
    <g transform="translate(48, 38)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <g transform="translate(0, 0)" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="1">
        <text x="0" y="10">BI &amp; ANALYTICS</text>
        <circle cx="108" cy="7" r="1.5" fill="#6e7681"/>
        <text x="118" y="10">PYTHON AUTOMATION</text>
        <circle cx="262" cy="7" r="1.5" fill="#6e7681"/>
        <text x="272" y="10">SISTEMAS INTERNOS</text>
      </g>

      <text x="-1" y="58" font-size="46" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">Lukyam Madeira</text>
      <text x="0" y="88" font-size="15.5" font-weight="500" fill="#58a6ff" letter-spacing="0.2">Data &amp; BI Analyst · Python Automation</text>
      <text x="0" y="116" font-size="13" font-weight="400" fill="#8b949e">Pipelines automatizados, modelagem analítica e soluções ponta a ponta.</text>
      <text x="0" y="148" font-size="11.5" font-weight="400" fill="#6e7681">EBM Quintto (Atual) · ex-ISGH · Fortaleza / Caucaia, CE</text>
    </g>

    <!-- Divisor vertical sutil -->
    <line x1="530" y1="30" x2="530" y2="190" stroke="#21262d" stroke-width="1"/>

    <!-- LADO DIREITO: Entregas Reais em Produção (Sóbrio, sem jargões inflados) -->
    <g transform="translate(560, 42)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="0" y="10" font-size="11" font-weight="600" letter-spacing="1" fill="#8b949e">PRODUÇÃO &amp; IMPACTO</text>

      <!-- Métrica 1: Python -->
      <g transform="translate(0, 32)">
        <text x="0" y="22" font-size="28" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">73k+</text>
        <text x="75" y="12" font-size="12.5" font-weight="500" fill="#f0f6fc">linhas de Python</text>
        <text x="75" y="27" font-size="10.5" fill="#8b949e">Scraping, DuckDB, QA e automações</text>
      </g>

      <line x1="0" y1="74" x2="290" y2="74" stroke="#21262d" stroke-width="1"/>

      <!-- Métrica 2: Sistemas Web Hospitalares -->
      <g transform="translate(0, 92)">
        <text x="0" y="22" font-size="28" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">25</text>
        <text x="50" y="12" font-size="12.5" font-weight="500" fill="#f0f6fc">sistemas web hospitalares</text>
        <text x="50" y="27" font-size="10.5" fill="#8b949e">ISGH · Apps Script, Sheets e automação</text>
      </g>
    </g>
  </g>
</svg>
